name: Deploy (VPS)

# Pipeline VPS auto-géré — build + push des 3 images vers GHCR, puis
# redéploiement par SSH. Complète (ne remplace pas) deploy.yml tant que
# Railway/Vercel ne sont pas décommissionnés — voir infra/DEPLOY-VPS.md.
#
# Secrets GitHub requis (Settings → Secrets and variables → Actions) :
#   VPS_HOST, VPS_USER, VPS_SSH_KEY
# infra/.env reste géré manuellement sur le VPS (jamais dans ce workflow).

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image prefix
        # GHCR exige des noms d'image en minuscules ; github.repository peut
        # contenir des majuscules (nom d'org/repo GitHub).
        run: echo "IMAGE_PREFIX=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.PROD_WS_URL }}
            NEXT_PUBLIC_AUTH_MODE=clerk
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & push ai-service
        uses: docker/build-push-action@v6
        with:
          context: apps/ai-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ai-service:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/ai-service:latest
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

  deploy:
    name: Deploy → VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Migrate & redeploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/merkure/infra
            git -C /opt/merkure pull --ff-only
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm api pnpm --filter @merkure/api db:migrate:prod
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
